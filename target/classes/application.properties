spring.application.name=ai-recruitment-system
server.port=8082
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# DATABASE CONFIGURATION (POSTGRESQL + PGVECTOR)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/cv
spring.datasource.username=postgres
spring.datasource.password=03012006
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# GOOGLE GEMINI AI CONFIGURATION (LANGCHAIN4J)
# ===============================
gemini.api.key=""
gemini.api.model=gemini-3.5-flash-lite
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/
gemini.embedding.model=gemini-embedding-001
gemini.embedding.dimension=768

# ===============================
# FILE STORAGE CONFIGURATION
# ===============================
app.storage.upload-dir=./uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ===============================
# JWT SECURITY
# ===============================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
